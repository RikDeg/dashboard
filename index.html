<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Personal Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .clock-card {
            background: var(--card-bg);
            padding: 20px 40px;
            border-radius: 15px;
            text-align: center;
            min-width: 200px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-top: 4px solid var(--accent);
        }

        .clock-time {
            font-size: 3rem;
            font-weight: bold;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }
        .clock-date {
            font-size: 1.1rem;
            color: #94a3b8; /* Un grigio più tenue */
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .clock-label {
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-size: 0.9rem;
        }

        .calendar-container {
            width: 95%;
            max-width: 1200px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        iframe {
            border-radius: 10px;
            filter: invert(90%) hue-rotate(180deg); /* Trucco per rendere il calendario scuro */
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="clock-card">
            <div class="clock-label">Bergamo</div>
            <div id="clock1" class="clock-time">00:00:00</div>
            <div id="date1" class="clock-date">00/00/0000</div> </div>
        </div>

        <div class="clock-card">
            <div class="clock-label">St. Louis</div>
            <div id="clock2" class="clock-time">00:00:00</div>
            <div id="date2" class="clock-date">00/00/0000</div> </div>
        </div>
    </div>

    <div class="calendar-container">
        <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=2&ctz=Europe%2FRome&showPrint=0&showTz=0&showTitle=0&mode=WEEK&src=cmljY2FyZG8uZGVnb25kYUBnbWFpbC5jb20&src=OThiOWE4YzgwMDkyNjFiNmE1YTBmYzY3NzU3ODA2YWVmYjQxMjFhNDMyNzQ3OGRmMjA5ODNmYjM2NmZmOWE4MUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=MTBhOTM3ZjVmMDg2YzIyMjJkOTc4OWZlOWI4YTAyNTI5NTIwNzBhYWEwYjJjYWI1NmYyNWJhZDE2ZWVhY2M2YUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=cG9jYjMxYjhwYjMxMW9scmptdWIxNXFmM3NAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=Y2hpYXJhLmNyb3R0aUBnbWFpbC5jb20&color=%237cb342&color=%23a79b8e&color=%23ad1457&color=%234285f4&color=%23e4c441" style="border-width:0" width="800" height="600" frameborder="0" scrolling="no">
                style="border: 0" width="100%" height="600" frameborder="0" scrolling="no"></iframe>
    </div>

    <script>
    function updateClocks() {
        const now = new Date();

        // Orologio Bergamo (Italia)
        const bgOptions = { 
            timeZone: 'Europe/Rome', 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit',
            hour12: false 
        };
        document.getElementById('clock1').innerText = now.toLocaleTimeString('it-IT', bgOptions);

        // Orologio St. Louis (Missouri, USA)
        const slOptions = { 
            timeZone: 'America/Chicago', 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit',
            hour12: false 
        };
        document.getElementById('clock2').innerText = now.toLocaleTimeString('it-IT', slOptions);
    }

    // Aggiorna ogni secondo
    setInterval(updateClocks, 1000);
    updateClocks();
</script>

</body>
</html>
